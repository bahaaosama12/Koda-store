<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار دفع Stripe - إدخال الفيزا التجريبية</title>
  <script src="https://js.stripe.com/v3/"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 22px;
      text-align: center;
    }
    .badge {
      background: #e2e8f0;
      color: #475569;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }
    #card-element {
      border: 1px solid #cbd5e1;
      padding: 14px;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 20px;
      direction: ltr;
    }
    button {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #4f46e5;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      text-align: center;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .test-card-hint {
      background: #eff6ff;
      color: #1e40af;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div style="text-align: center;"><span class="badge">💳 بيئة تجريبية (Stripe Test)</span></div>
    <h2>اختبار دفع بطاقة الفيزا</h2>

    <div class="test-card-hint">
      💡 <b>بطاقة الفيزا التجريبية:</b><br>
      رقم البطاقة: <code style="direction: ltr; display: inline-block;">4242 4242 4242 4242</code><br>
      تاريخ الانتهاء: أي تاريخ مستقبلي (مثلاً 12/30) | CVC: 123
    </div>

    <form id="payment-form">
      <label for="orderId">رقم الطلب (Order ID):</label>
      <input type="text" id="orderId" value="6a9df8ec8f226c59711feda0" placeholder="أدخل ID الطلب هنا" required>

      <label>بيانات بطاقة الفيزا:</label>
      <div id="card-element"></div>

      <button id="submit-btn" type="submit">إرسال والدفع الآن 🚀</button>
    </form>

    <div id="payment-message" class="message"></div>
  </div>

  <script>
    // Initialize Stripe with your Publishable Key
    const stripe = Stripe('pk_test_51UFgxyF7F2Bwor0WYY6YuoJn8Ts343Qx9fa9raNDqmNDmujcdzzroJ8dZkvsF8mXZi9954lZIPHMdRimZYNxLaqa008ev8YmZ0');
    const elements = stripe.elements();

    const cardElement = elements.create('card', {
      style: {
        base: {
          fontSize: '16px',
          color: '#32325d',
          '::placeholder': { color: '#aab7c4' }
        },
        invalid: { color: '#fa755a', iconColor: '#fa755a' }
      }
    });

    cardElement.mount('#card-element');

    const form = document.getElementById('payment-form');
    const submitBtn = document.getElementById('submit-btn');
    const messageDiv = document.getElementById('payment-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري معالجة الدفع...';
      messageDiv.style.display = 'none';

      const orderId = document.getElementById('orderId').value.trim();

      try {
        // 1. Create PaymentIntent from backend
        const response = await fetch('/api/payments/create-payment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId })
        });

        const data = await response.json();

        if (!data.success || !data.clientSecret) {
          throw new Error(data.message || 'فشل في إنشاء جلسة الدفع');
        }

        // 2. Confirm Payment using Stripe.js
        const result = await stripe.confirmCardPayment(data.clientSecret, {
          payment_method: {
            card: cardElement,
            billing_details: { name: 'عميل تجريبي' }
          }
        });

        if (result.error) {
          messageDiv.className = 'message error';
          messageDiv.textContent = '❌ فشل الدفع: ' + result.error.message;
          messageDiv.style.display = 'block';
        } else if (result.paymentIntent && result.paymentIntent.status === 'succeeded') {
          messageDiv.className = 'message success';
          messageDiv.innerHTML = '🎉 <b>تمت عملية الدفع بنجاح!</b><br>سيقوم الـ Webhook بتحديث حالة الطلب أوتوماتيكياً الآن في قاعدة البيانات.';
          messageDiv.style.display = 'block';
        }
      } catch (err) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ خطأ: ' + err.message;
        messageDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'إرسال والدفع الآن 🚀';
      }
    });
  </script>
</body>
</html>
