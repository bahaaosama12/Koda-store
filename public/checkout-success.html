<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم الدفع بنجاح 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      margin: 0 auto 20px auto;
    }
    h1 {
      color: #0f172a;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .session-info {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #475569;
      word-break: break-all;
      margin-bottom: 25px;
      direction: ltr;
    }
    .btn {
      display: inline-block;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">✓</div>
    <h1>تمت عملية الدفع بنجاح! 🎉</h1>
    <p>شكراً لك! تم استلام دفعتك وتأكيد الطلب تلقائياً عبر نظام Webhook الخاص بـ Stripe.</p>
    
    <div class="session-info" id="session-id">Session ID: ...</div>

    <a href="/" class="btn">العودة للمتجر الرئيسي</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');
    if (sessionId) {
      document.getElementById('session-id').textContent = 'Session ID: ' + sessionId;
    }
  </script>
</body>
</html>
